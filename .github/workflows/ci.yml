name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TesserChat.slnx

      - name: Build
        run: dotnet build TesserChat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TesserChat.slnx --configuration Release --no-build --verbosity normal
        env:
          # The Postgres integration tests need a Linux container, which only the Linux runner can
          # serve — the Windows runner's daemon is in Windows-container mode and the macOS runner
          # has none. They skip elsewhere; here a missing daemon must fail the job rather than
          # quietly skip, or this runner could go green having tested nothing. See §0.3.
          TESSERCHAT_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' }}
